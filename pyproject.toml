[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-arcade"
version = "0.2.0"
description = "Pluggable multiplayer game engine and clients for Data2G radio links"
requires-python = ">=3.10"

[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
tui = ["textual>=0.80"]
all = ["PySide6>=6.6", "textual>=0.80"]

[project.scripts]
radio-arcade = "radio_arcade.desktop:main"
radio-arcade-tui = "radio_arcade.tui:main"
radio-arcade-cli = "radio_arcade.cli:main"

[tool.setuptools.packages.find]
include = ["radio_arcade*"]

[tool.setuptools.package-data]
"radio_arcade.games" = ["data/*.txt"]
